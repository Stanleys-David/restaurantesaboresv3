<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Restaurante Sabores</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
  <main class="perfil-container">
    <section class="perfil-card">
      <header class="perfil-header"><h1>Mi Perfil</h1><a href="menu.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver</a></header>
      <div class="perfil-photo-section"><div class="photo-wrapper"><img id="profilePhoto" src="https://via.placeholder.com/150" alt="Foto de perfil"></div><p id="userRole" class="user-role">Cliente</p></div>
      <div class="profile-summary"><p><i class="fas fa-user"></i><span id="summaryName">—</span></p><p><i class="fas fa-envelope"></i><span id="summaryEmail">—</span></p><p><i class="fas fa-phone"></i><span id="summaryPhone">Sin teléfono</span></p><p><i class="fas fa-location-dot"></i><span id="summaryAddress">Sin dirección</span></p></div>
      <button id="openProfileModal" class="btn btn-primary"><i class="fas fa-pen"></i> Editar perfil</button>
      <div id="notification" class="notification"></div>
    </section>
  </main>
  <div id="profileModal" class="profile-modal" aria-hidden="true">
    <div class="profile-modal-content" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
      <button id="closeProfileModal" class="modal-close" type="button" aria-label="Cerrar">&times;</button>
      <h2 id="profileModalTitle">Editar perfil</h2>
      <form id="profileForm" class="perfil-form">
        <div class="perfil-photo-section modal-photo"><div class="photo-wrapper"><img id="modalProfilePhoto" src="https://via.placeholder.com/150" alt="Vista previa de la foto"><label for="photoInput" class="photo-edit-btn" title="Cambiar foto"><i class="fas fa-camera"></i></label><input type="file" id="photoInput" accept="image/*" hidden></div></div>
        <div class="form-row"><div class="form-group"><label for="name">Nombre</label><input type="text" id="name" required></div><div class="form-group"><label for="surname">Apellido</label><input type="text" id="surname"></div></div>
        <div class="form-group"><label for="email">Correo electrónico</label><input type="email" id="email" disabled></div>
        <div class="form-group"><label for="phone">Teléfono</label><input type="tel" id="phone" placeholder="Ej: 3001234567"></div>
        <div class="form-group"><label for="address">Dirección</label><input type="text" id="address" placeholder="Calle, número, barrio"></div>
        <div class="form-group"><label for="addressReference">Complementos / Referencias</label><textarea id="addressReference" rows="2" placeholder="Ej: Casa blanca, portón negro, cerca del parque"></textarea></div>
        <div class="form-actions"><button type="submit" class="btn btn-primary" id="saveBtn"><i class="fas fa-save"></i> Guardar cambios</button></div>
      </form>
    </div>
  </div>
  <script type="module" src="../js/perfil.js"></script>
</body>
</html>
