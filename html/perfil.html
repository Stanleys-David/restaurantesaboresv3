<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Restaurante Sabores</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
  <div class="perfil-container">
    <div class="perfil-card">
      <div class="perfil-header">
        <h1>Mi Perfil</h1>
        <a href="menu.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver</a>
      </div>

      <div class="perfil-photo-section">
        <div class="photo-wrapper">
          <img id="profilePhoto" src="https://via.placeholder.com/150" alt="Foto de perfil">
          <label for="photoInput" class="photo-edit-btn" title="Cambiar foto">
            <i class="fas fa-camera"></i>
          </label>
          <input type="file" id="photoInput" accept="image/*" hidden>
        </div>
        <p id="userRole" class="user-role">Cliente</p>
      </div>

      <form id="profileForm" class="perfil-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-group">
            <label for="surname">Apellido</label>
            <input type="text" id="surname">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" disabled>
        </div>

        <div class="form-group">
          <label for="phone">Teléfono</label>
          <input type="tel" id="phone" placeholder="Ej: 3001234567">
        </div>

        <div class="form-group">
          <label for="address">Dirección</label>
          <input type="text" id="address" placeholder="Calle, número, barrio">
        </div>

        <div class="form-group">
          <label for="addressReference">Complementos / Referencias</label>
          <textarea id="addressReference" rows="2" placeholder="Ej: Casa blanca, portón negro, cerca del parque"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">
            <i class="fas fa-save"></i> Guardar cambios
          </button>
        </div>
      </form>

      <div id="notification" class="notification"></div>
    </div>
  </div>

  <script type="module" src="../js/perfil.js"></script>
</body>
</html>
